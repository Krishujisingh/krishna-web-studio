<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Class 11 Mathematics Test | The Ultimate Classes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050b16;
            color: white;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: #07182c;
        }

        header h1 {
            color: #4da6ff;
        }

        header p {
            color: #b9c7d8;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        .question {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 22px;
        }

        .question h3 {
            color: #ffd43b;
        }

        label {
            display: block;
            padding: 10px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
        }

        label:hover {
            background: rgba(77, 166, 255, 0.15);
        }

        .submit-btn {
            display: block;
            margin: 30px auto;
            padding: 14px 30px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #005bea;
        }

        #result {
            text-align: center;
            font-size: 22px;
            color: #ffd43b;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <header>

        <h1>Class 11 Mathematics Test</h1>

        <p>
            THE ULTIMATE CLASSES
        </p>

    </header>


    <div class="container">

        <form id="mathTest">


            <!-- Question 1 -->

            <div class="question">

                <h3>Q1. What is the value of 2 + 3?</h3>

                <label>
                    <input type="radio" name="q1" value="4">
                    4
                </label>

                <label>
                    <input type="radio" name="q1" value="5">
                    5
                </label>

                <label>
                    <input type="radio" name="q1" value="6">
                    6
                </label>

                <label>
                    <input type="radio" name="q1" value="7">
                    7
                </label>

            </div>


            <!-- Question 2 -->

            <div class="question">

                <h3>Q2. What is the value of 5 × 2?</h3>

                <label>
                    <input type="radio" name="q2" value="8">
                    8
                </label>

                <label>
                    <input type="radio" name="q2" value="10">
                    10
                </label>

                <label>
                    <input type="radio" name="q2" value="12">
                    12
                </label>

                <label>
                    <input type="radio" name="q2" value="15">
                    15
                </label>

            </div>


            <!-- Question 3 -->

            <div class="question">

                <h3>Q3. What is the value of 10²?</h3>

                <label>
                    <input type="radio" name="q3" value="20">
                    20
                </label>

                <label>
                    <input type="radio" name="q3" value="50">
                    50
                </label>

                <label>
                    <input type="radio" name="q3" value="100">
                    100
                </label>

                <label>
                    <input type="radio" name="q3" value="200">
                    200
                </label>

            </div>


            <button type="button" class="submit-btn" onclick="checkTest()">
                Submit Test
            </button>


            <div id="result"></div>

        </form>

    </div>


    <script>

        function checkTest() {

            let score = 0;

            if (document.querySelector('input[name="q1"]:checked')?.value === "5") {
                score++;
            }

            if (document.querySelector('input[name="q2"]:checked')?.value === "10") {
                score++;
            }

            if (document.querySelector('input[name="q3"]:checked')?.value === "100") {
                score++;
            }

            document.getElementById("result").innerHTML =
                "Your Score: " + score + " / 3";

        }

    </script>

</body>

</html>
